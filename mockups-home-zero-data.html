<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرئيسية بعد تسجيل الدخول مباشرة — بلا أي معلومة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a3a6b;--navy-d:#12294d;--cream:#faf8f0;--cream-d:#efeadb;
 --line:rgba(26,58,107,.10);--line-2:rgba(26,58,107,.055);
 --muted:#7c8798;--muted-2:#9ba4b2;--red:#c0392b;--ok:#1e7a4b;--r:18px;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html,body{margin:0}
body{background:#e6e3d9;color:var(--navy);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
 line-height:1.65;-webkit-font-smoothing:antialiased}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:Inter,system-ui,sans-serif;font-feature-settings:"tnum"}
button{font-family:inherit;background:none;border:0;color:inherit}
svg{display:block;flex:0 0 auto}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.topbar{position:sticky;top:0;z-index:80;background:var(--navy-d);color:#fff;padding:11px 20px;
 display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.topbar h1{font-size:14px;margin:0;font-weight:600;opacity:.93}
.sp{flex:1}
.seg{display:flex;background:rgba(255,255,255,.09);border-radius:999px;padding:3px;gap:2px}
.seg button{color:#c3d1e6;font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:999px;cursor:pointer;transition:.15s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy-d)}
.stage{padding:24px 20px 60px}.wrap{max-width:1180px;margin:0 auto}
.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:13.5px;
 color:#46536a;line-height:1.85;margin-bottom:18px}
.note b{color:var(--navy)}.note ul{margin:8px 0 0;padding-inline-start:20px}.note li{margin:5px 0}
.side{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:start}
@media(max-width:1040px){.side{grid-template-columns:1fr;justify-items:center}}
.deskframe{background:var(--cream);border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(18,41,77,.17)}
.phoneframe{width:392px;border-radius:38px;padding:10px;background:#1c1c1e;box-shadow:0 24px 55px rgba(18,41,77,.26)}
.screen{background:var(--cream);border-radius:29px;overflow:hidden;height:770px;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.card+.card{margin-top:18px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:1.2px;color:var(--muted-2);margin:0 0 12px;text-transform:uppercase}
h2.t{margin:0;font-size:24px;font-weight:700;line-height:1.42;letter-spacing:-.4px}
h3.t{margin:0;font-size:15.5px;font-weight:700}
p.d{margin:9px 0 0;font-size:14px;color:var(--muted);line-height:1.78}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.link{font-size:13px;font-weight:600;opacity:.6;cursor:pointer}.link:hover{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;
 border-radius:12px;font-size:14.5px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:.18s var(--ease)}
.btn-n{background:var(--navy);color:#fff}.btn-n:hover{background:var(--navy-d)}
.btn-o{border-color:var(--line);color:var(--navy);background:#fff}.btn-o:hover{border-color:rgba(26,58,107,.3)}
.btn-w{background:#fff;color:var(--navy)}
.btn-gh{border-color:rgba(255,255,255,.3);color:#fff}.btn-gh:hover{background:rgba(255,255,255,.11)}
.btn-s{min-height:38px;padding:0 14px;font-size:13px;border-radius:10px}
.btn-blk{width:100%}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

.dhd{padding:22px 30px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:14px}
.dhd h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.25px}
.dhd .sub{font-size:13px;color:var(--muted);margin-top:3px}
.ava{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
 align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:0 0 auto}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;
 display:flex;align-items:center;justify-content:center;cursor:pointer}
.dbody{padding:22px 30px 40px}
.dg{display:grid;grid-template-columns:1.85fr 1fr;gap:22px;align-items:start}
@media(max-width:980px){.dg{grid-template-columns:1fr}}
.shell{display:flex;min-height:660px}.shell .main{flex:1;min-width:0}
.rail{width:66px;background:#fff;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;
 align-items:center;padding:18px 0;gap:6px}
.rail a{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
 opacity:.38;cursor:pointer;transition:.16s}
.rail a:hover{opacity:.85;background:var(--cream)}
.rail a.on{opacity:1;background:var(--navy);color:#fff}

/* ── the ONE question ── */
.anchor{background:var(--navy);color:#fff;border-radius:var(--r);padding:27px 29px;position:relative;overflow:hidden}
.anchor:before{content:"";position:absolute;inset-inline-end:-80px;top:-100px;width:320px;height:320px;
 border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 62%)}
.anchor .eyebrow{color:rgba(255,255,255,.5)}
.anchor p.d{color:rgba(255,255,255,.76)}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
@media(max-width:760px){.picks{grid-template-columns:1fr 1fr}}
.pick{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:14px;
 padding:16px 14px;cursor:pointer;transition:.18s var(--ease);text-align:center;min-height:104px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
.pick:hover{background:rgba(255,255,255,.17);transform:translateY(-2px)}
.pick b{font-size:14.5px;font-weight:600;display:block}
.pick span{font-size:11.5px;color:rgba(255,255,255,.62);display:block;line-height:1.5}
.orline{display:flex;align-items:center;gap:12px;margin-top:18px;color:rgba(255,255,255,.45);font-size:12px}
.orline i{flex:1;height:1px;background:rgba(255,255,255,.18)}
.freebox{display:flex;gap:9px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);
 border-radius:13px;padding:7px 9px 7px 7px;align-items:center;margin-top:14px}
.freebox input{flex:1;background:none;border:0;outline:0;font:inherit;font-size:14px;color:#fff;padding:9px}
.freebox input::placeholder{color:rgba(255,255,255,.45)}
.freebox .go{width:40px;height:40px;border-radius:11px;background:#fff;color:var(--navy);display:flex;
 align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
.tiny{font-size:11.5px;color:rgba(255,255,255,.5);margin-top:13px}

/* ── essentials list ── */
.ess{list-style:none;margin:16px 0 0;padding:0}
.ess li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-2);
 cursor:pointer;transition:.16s}
.ess li:first-child{border-top:0}
.ess li:hover .lbl{transform:translateX(-3px)}
.ess .ic{width:38px;height:38px;border-radius:11px;background:var(--cream);display:flex;align-items:center;
 justify-content:center;opacity:.72;flex:0 0 auto}
.ess .lbl{flex:1;min-width:0;transition:.16s var(--ease)}
.ess b{display:block;font-size:14.8px;font-weight:600}
.ess small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ess .meta{font-size:12px;color:var(--muted-2);white-space:nowrap;text-align:left}
.ess .meta b{font-size:12.5px;color:var(--navy);font-weight:600}

/* ── guides ── */
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:15px}
@media(max-width:760px){.gd{grid-template-columns:1fr}}
.gd a{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;
 cursor:pointer;transition:.18s var(--ease)}
.gd a:hover{border-color:rgba(26,58,107,.3);transform:translateY(-2px)}
.gd b{display:block;font-size:14px;font-weight:600;line-height:1.55}
.gd span{display:block;font-size:12px;color:var(--muted-2);margin-top:6px}

.rate{display:flex;gap:26px;margin-top:12px}
.rate b{display:block;font-size:26px;font-weight:600;letter-spacing:-.7px;line-height:1.2}
.rate span{font-size:12.5px;color:var(--muted)}
.delta{font-size:11.5px;font-weight:600}.up{color:var(--ok)}.dn{color:var(--red)}
.spark path{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.6s var(--ease) .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hairnote{font-size:11.5px;color:var(--muted-2);margin-top:13px;padding-top:12px;border-top:1px solid var(--line-2)}
.inv{border:1px dashed rgba(26,58,107,.22);background:rgba(255,255,255,.5);border-radius:var(--r);padding:20px 22px}
.inv .ic{width:38px;height:38px;border-radius:11px;background:var(--cream-d);display:flex;align-items:center;
 justify-content:center;opacity:.7;margin-bottom:13px}
.inv b{display:block;font-size:14.5px;font-weight:600}
.inv p{margin:5px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
.prog{display:flex;align-items:center;gap:11px;margin-top:13px}
.prog .track{flex:1;height:3px;border-radius:99px;background:var(--cream-d);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .9s var(--ease)}
.prog .n{font-size:12.5px;color:var(--muted);white-space:nowrap}
.road{list-style:none;margin:15px 0 0;padding:0}
.road li{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--line-2);align-items:center}
.road li:first-child{border-top:0}
.road .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;display:flex;
 align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:var(--muted-2);
 font-family:Inter,system-ui,sans-serif}
.road li.first .n{background:var(--navy);border-color:var(--navy);color:#fff}
.road li.dim{opacity:.5}
.road .lbl{flex:1;font-size:14px;font-weight:500}
.road .meta{font-size:11.5px;color:var(--muted-2)}

/* phone */
.mhd{padding:16px 18px 12px;display:flex;align-items:center;gap:12px;background:var(--cream);position:sticky;top:0;z-index:9}
.mhd h2{margin:0;font-size:17px;font-weight:700}
.mhd .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.mava{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
 align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto}
.mbell{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;
 display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pad{padding:0 18px}
.msec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 0;padding:0 18px}
.msec h3{margin:0;font-size:15px;font-weight:700}
.msec span{font-size:12.5px;color:var(--muted);font-weight:600}
.mlist{list-style:none;margin:10px 0 0;padding:0 18px;background:#fff;border-block:1px solid var(--line-2)}
.mlist li{display:flex;align-items:center;gap:13px;padding:14px 0;border-top:1px solid var(--line-2)}
.mlist li:first-child{border-top:0}
.mcar{display:flex;gap:12px;overflow-x:auto;padding:12px 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.mcar::-webkit-scrollbar{display:none}
.mcar>div{flex:0 0 76%;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 19px}
.mcar>div.dash{border-style:dashed;background:rgba(255,255,255,.5)}
.mtab{display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 0 12px;flex:0 0 auto}
.mtab div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;
 color:var(--muted-2);font-weight:600;min-height:46px;justify-content:center}
.mtab div.on{color:var(--navy)}.mtab div svg{opacity:.45}.mtab div.on svg{opacity:1}
.mpicks{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.mpick{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:13px;padding:14px 10px;
 text-align:center;min-height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.mpick b{font-size:13.5px;font-weight:600}
.mpick span{font-size:10.5px;color:rgba(255,255,255,.6);line-height:1.45}

.toast{position:fixed;bottom:26px;inset-inline-start:26px;background:var(--navy);color:#fff;padding:13px 19px;
 border-radius:12px;font-size:13.5px;z-index:99;display:flex;align-items:center;gap:10px;opacity:0;
 transform:translateY(14px);transition:.3s var(--ease);pointer-events:none;box-shadow:0 10px 30px rgba(18,41,77,.3)}
.toast.on{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fresh{animation:rise .5s var(--ease) both}
</style>
</head>
<body>

<div class="topbar">
  <h1>الرئيسية بعد تسجيل الدخول مباشرة — صفر معلومات عن المستخدم</h1>
  <div class="sp"></div>
  <div class="seg" id="s">
    <button data-v="0" aria-pressed="true">قبل أي إجابة</button>
    <button data-v="1" aria-pressed="false">بعد إجابة واحدة</button>
  </div>
</div>

<div class="stage"><div class="wrap">
<div class="note" id="cap"></div>

<div class="side">
  <div><div class="deskframe"><div class="shell">
    <div class="main">
      <div class="dhd" id="dhd"></div>
      <div class="dbody"><div class="dg"><div id="dmain"></div><div id="dside"></div></div></div>
    </div>
    <div class="rail" id="rail"></div>
  </div></div></div>
  <div><div class="phoneframe"><div class="screen">
    <div class="scroll"><div id="mall"></div><div style="height:40px"></div></div>
    <div class="mtab" id="mtab"></div>
  </div></div></div>
</div>

<div class="note" style="margin-top:20px" id="tail"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const I=(p,s=19,w=1.6)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ic={
 home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
 msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
 map:'<path d="M14.1 4.1 21 2v16l-6.9 2.1M14.1 4.1 9 6M14.1 4.1v16M9 6 3 4v16l6 2M9 6v16"/>',
 file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h6M9 13h6M9 17h6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
 gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
 bell:'<path d="M10.3 21a2 2 0 0 0 3.4 0"/><path d="M3.3 15.3A1 1 0 0 0 4 17h16a1 1 0 0 0 .7-1.7C19.4 14 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.4 6-2.7 7.3"/>',
 plane:'<path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8L8 11l-3 3H3l1 2 2 1 1-2 3-3 3.9 3.7a.5.5 0 0 0 .8-.5Z"/>',
 grad:'<path d="M22 10 12 5 2 10l10 5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
 brief:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
 card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 15h.01M11 15h4M7 9h4"/>',
 bank:'<path d="M3 21h18M5 21V10M9 21V10M15 21V10M19 21V10M2 10h20L12 3Z"/>',
 shield:'<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1 1 0 0 1 1.6 0C14.6 3.8 17 5 19 5a1 1 0 0 1 1 1Z"/>',
 bus:'<path d="M8 6v6M15 6v6M2 12h19.6M18 18h1a1 1 0 0 0 1-1V7a5 5 0 0 0-5-5H9a5 5 0 0 0-5 5v10a1 1 0 0 0 1 1h1"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
 phone:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
 send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/>',
 alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
 book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8 12 3 7 8M12 3v13"/>',
 arrow:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 sparkles:'<path d="M12 3 13.9 8.6 19.5 10.5 13.9 12.4 12 18 10.1 12.4 4.5 10.5 10.1 8.6Z"/><path d="M19 15v4M17 17h4"/>',
};
document.getElementById('rail').innerHTML=
 `<a class="on">${I(ic.home,20)}</a><a>${I(ic.msg,20)}</a><a>${I(ic.map,20)}</a>
  <a>${I(ic.file,20)}</a><a>${I(ic.folder,20)}</a><a>${I(ic.gift,20)}</a>
  <div style="flex:1"></div><a>${I(ic.user,20)}</a>`;
document.getElementById('mtab').innerHTML=
 `<div class="on">${I(ic.home,19)}الرئيسية</div><div>${I(ic.msg,19)}المساعد</div>
  <div>${I(ic.map,19)}الخريطة</div><div>${I(ic.file,19)}الخدمات</div><div>${I(ic.user,19)}حسابي</div>`;

/* ما يصلح للجميع بلا استثناء */
const ESS=[
 [ic.card,'الرقم الضريبي <span class="ltr">(Vergi No)</span>','يطلبه البنك والعقد والإقامة — ابدأ به','٢٠ دقيقة','مجاني'],
 [ic.file,'تصريح الإقامة <span class="ltr">(İkamet)</span>','التسلسل الكامل ومتى يجب أن تبدأ','٤–٨ أسابيع','رسوم رسمية'],

    justify-content:center;font-size:11.5px;font-weight:600;font-family:Inter,sans-serif;
    ${i===0?'background:var(--navy);color:#fff':'border:1.5px solid var(--line);color:var(--muted-2)'}"
    class="ltr">${i+1}</span>
   <span style="flex:1;font-size:14.3px;font-weight:500">${t}</span>
   <small style="font-size:11.5px;color:var(--muted-2)">${m}</small></li>`).join('')}</ul>
  <div class="pad" style="margin-top:18px">
   <div style="border:1px dashed rgba(26,58,107,.22);background:rgba(255,255,255,.55);border-radius:16px;padding:16px 17px">
    <div style="display:flex;gap:12px;align-items:flex-start">
     <span style="opacity:.45;margin-top:2px">${I(ic.map,19)}</span>
     <div><b style="display:block;font-size:14px;font-weight:600">في أي حيّ تسكن؟</b>
      <span style="font-size:12.5px;color:var(--muted);line-height:1.7">لنعرض المكاتب القريبة ونحذّرك إن أُغلق حيّك.</span></div></div>
    <div style="display:flex;gap:9px;margin-top:13px">
     <button class="btn btn-o btn-s" style="flex:1">أضف حيّك</button>
     <button class="btn btn-s" style="color:var(--muted)">لاحقًا</button></div></div></div>
  <div class="msec"><h3>نظرة سريعة</h3><span></span></div>
  <div class="mcar">
   <div><p class="eyebrow">تنبيه من رفيق</p>
    <b style="font-size:13.8px;font-weight:600;display:block;line-height:1.55">أُغلق حيّ الفاتح مؤقتًا</b>
    <p style="margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7">تحقّق قبل توقيع أي عقد.</p></div>
   <div><p class="eyebrow">أسعار اليوم</p><div class="rate" style="gap:18px">
    <div><b class="ltr" style="font-size:22px">47.34</b><span>دولار <span class="delta up">▲</span></span></div>
    <div><b class="ltr" style="font-size:22px">53.92</b><span>يورو <span class="delta dn">▼</span></span></div></div></div>
   <div class="dash"><p class="eyebrow">مجانًا</p><b style="font-size:14px">مكالمتك الأولى</b>
    <p style="margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7">خبير بلغتك، بلا التزام.</p>
    <button class="btn btn-o btn-s btn-blk" style="margin-top:12px">احجز</button></div>
  </div>`
};

const V=[V0,V1];
let t;const toast=document.getElementById('toast');
const say=m=>{toast.innerHTML=I(ic.check,15,2.6)+m;toast.classList.add('on');
 clearTimeout(t);t=setTimeout(()=>toast.classList.remove('on'),2600);};

function go(k){
 const v=V[k];
 document.getElementById('cap').innerHTML=v.cap;
 document.getElementById('tail').innerHTML=v.tail;
 document.getElementById('dhd').innerHTML=v.dhd;
 document.getElementById('dmain').innerHTML=v.dmain;
 document.getElementById('dside').innerHTML=v.dside;
 document.getElementById('mall').innerHTML=v.m;
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
  say('تم — خطتك جاهزة');
  document.querySelectorAll('#s button').forEach((x,i)=>x.setAttribute('aria-pressed',i===1));
  go(1);});
}
document.querySelectorAll('#s button').forEach((b,i)=>b.onclick=()=>{
 document.querySelectorAll('#s button').forEach(x=>x.setAttribute('aria-pressed',x===b));go(i);});
go(0);
</script>
</body>
</html>
