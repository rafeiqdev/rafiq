<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة المستخدم الجديد — كل الصفحات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a3a6b;--navy-d:#12294d;--cream:#faf8f0;--cream-d:#efeadb;
 --line:rgba(26,58,107,.10);--line-2:rgba(26,58,107,.055);
 --muted:#7c8798;--muted-2:#9ba4b2;--red:#c0392b;--ok:#1e7a4b;--r:18px;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html,body{margin:0}
body{background:#e6e3d9;color:var(--navy);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
 line-height:1.65;-webkit-font-smoothing:antialiased}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:Inter,system-ui,sans-serif;font-feature-settings:"tnum"}
button{font-family:inherit;background:none;border:0;color:inherit}
svg{display:block;flex:0 0 auto}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.topbar{position:sticky;top:0;z-index:80;background:var(--navy-d);color:#fff;padding:11px 20px;
 display:flex;flex-wrap:wrap;gap:11px;align-items:center}
.topbar h1{font-size:14px;margin:0;font-weight:600;opacity:.93}
.sp{flex:1}
.seg{display:flex;background:rgba(255,255,255,.09);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{color:#c3d1e6;font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy-d)}
.stage{padding:24px 20px 60px}.wrap{max-width:1180px;margin:0 auto}
.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:13.5px;
 color:#46536a;line-height:1.85;margin-bottom:18px}
.note b{color:var(--navy)}.note ul{margin:8px 0 0;padding-inline-start:20px}.note li{margin:4px 0}
.bad{color:var(--red);font-weight:600}
.side{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:start}
@media(max-width:1040px){.side{grid-template-columns:1fr;justify-items:center}}
.deskframe{background:var(--cream);border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(18,41,77,.17);min-height:600px}
.phoneframe{width:392px;border-radius:38px;padding:10px;background:#1c1c1e;box-shadow:0 24px 55px rgba(18,41,77,.26)}
.screen{background:var(--cream);border-radius:29px;overflow:hidden;height:740px;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.card+.card{margin-top:18px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:1.2px;color:var(--muted-2);margin:0 0 12px;text-transform:uppercase}
h2.t{margin:0;font-size:24px;font-weight:700;line-height:1.42;letter-spacing:-.4px}
h3.t{margin:0;font-size:15.5px;font-weight:700}
p.d{margin:9px 0 0;font-size:14px;color:var(--muted);line-height:1.78}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.link{font-size:13px;font-weight:600;opacity:.6;cursor:pointer}.link:hover{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;
 border-radius:12px;font-size:14.5px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:.18s var(--ease)}
.btn-n{background:var(--navy);color:#fff}.btn-n:hover{background:var(--navy-d)}
.btn-o{border-color:var(--line);color:var(--navy);background:#fff}.btn-o:hover{border-color:rgba(26,58,107,.3)}
.btn-w{background:#fff;color:var(--navy)}
.btn-gh{border-color:rgba(255,255,255,.3);color:#fff}.btn-gh:hover{background:rgba(255,255,255,.11)}
.btn-s{min-height:38px;padding:0 14px;font-size:13px;border-radius:10px}
.btn-blk{width:100%}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.anchor{background:var(--navy);color:#fff;border-radius:var(--r);padding:26px 28px;position:relative;overflow:hidden}
.anchor:before{content:"";position:absolute;inset-inline-end:-80px;top:-100px;width:300px;height:300px;
 border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 62%)}
.anchor .eyebrow{color:rgba(255,255,255,.5)}.anchor p.d{color:rgba(255,255,255,.76)}
.inv{border:1px dashed rgba(26,58,107,.22);background:rgba(255,255,255,.5);border-radius:var(--r);padding:22px 24px}
.inv .ic{width:40px;height:40px;border-radius:12px;background:var(--cream-d);display:flex;align-items:center;
 justify-content:center;opacity:.7;margin-bottom:14px}
.pg{display:none;padding:26px 30px 40px}.pg.on{display:block}
.pgm{display:none}.pgm.on{display:block}
.center{max-width:520px;margin:0 auto}
.pad{padding:0 18px}
.mhd{padding:16px 18px 12px;display:flex;align-items:center;gap:12px;background:var(--cream);
 position:sticky;top:0;z-index:9}
.mhd h2{margin:0;font-size:17px;font-weight:700}
.mhd .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.mtab{display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 0 12px;flex:0 0 auto}
.mtab div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;
 color:var(--muted-2);font-weight:600;min-height:46px;justify-content:center}
.mtab div.on{color:var(--navy)}.mtab div svg{opacity:.45}.mtab div.on svg{opacity:1}
.back{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;
 display:flex;align-items:center;justify-content:center;flex:0 0 auto}

/* onboarding */
.dots{display:flex;gap:6px;margin-bottom:22px}
.dots i{height:3px;flex:1;border-radius:99px;background:var(--cream-d)}
.dots i.on{background:var(--navy)}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#fff;border-radius:14px;
 padding:16px 18px;cursor:pointer;transition:.16s var(--ease);text-align:right;min-height:64px}
.opt:hover{border-color:rgba(26,58,107,.32);transform:translateY(-1px)}
.opt.sel{border-color:var(--navy);border-width:2px;padding:15px 17px;background:rgba(26,58,107,.03)}
.opt .ic{width:40px;height:40px;border-radius:12px;background:var(--cream);display:flex;align-items:center;
 justify-content:center;opacity:.72;flex:0 0 auto}
.opt b{display:block;font-size:15px;font-weight:600}
.opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.opt .tick{margin-inline-start:auto;opacity:0;color:var(--navy)}
.opt.sel .tick{opacity:1}
.why{display:flex;gap:11px;background:rgba(26,58,107,.04);border-radius:12px;padding:13px 15px;margin-top:18px;
 font-size:12.5px;color:var(--muted);line-height:1.7}
.why svg{opacity:.45;margin-top:2px}

/* services */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:13px;
 font-weight:600;cursor:pointer;transition:.15s}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:700px){.svc{grid-template-columns:1fr}}
.svc a{display:block;background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px 18px;
 cursor:pointer;transition:.18s var(--ease)}
.svc a:hover{border-color:rgba(26,58,107,.3);transform:translateY(-2px)}
.svc .ic{width:36px;height:36px;border-radius:11px;background:var(--cream);display:flex;align-items:center;
 justify-content:center;opacity:.7;margin-bottom:11px}
.svc b{display:block;font-size:14.5px;font-weight:600}
.svc span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.svc .meta{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted-2);
 display:flex;gap:12px}

/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;padding:8px 0}
.starter{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:13.8px;
 font-weight:500;text-align:right;cursor:pointer;transition:.16s;width:100%;min-height:52px;display:flex;
 align-items:center;gap:11px}
.starter:hover{border-color:rgba(26,58,107,.3);transform:translateY(-1px)}
.starter .ic{opacity:.4}
.bubble{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:14px 17px;
 font-size:14px;line-height:1.8;max-width:82%}
.bubble.me{background:var(--navy);color:#fff;border-color:var(--navy);border-radius:16px 16px 4px 16px;
 margin-inline-start:auto}
.composer{display:flex;gap:9px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:8px 10px 8px 8px;
 align-items:center;margin-top:16px}
.composer input{flex:1;border:0;outline:0;font:inherit;font-size:14px;background:none;color:inherit;padding:8px}
.composer input::placeholder{color:var(--muted-2)}
.send{width:40px;height:40px;border-radius:11px;background:var(--navy);color:#fff;display:flex;
 align-items:center;justify-content:center;flex:0 0 auto}
.quota{font-size:12px;color:var(--muted-2);margin-top:10px;text-align:center}

/* map preview */
.mapbox{height:290px;border-radius:16px;position:relative;overflow:hidden;
 background:radial-gradient(circle at 24% 62%,#cfe0d2 0 15%,transparent 16%),
 radial-gradient(circle at 72% 30%,#cfe0d2 0 12%,transparent 13%),
 radial-gradient(circle at 50% 85%,#c8d9ea 0 20%,transparent 21%),
 linear-gradient(150deg,#dde7f3,#eef2f8)}
.rd{position:absolute;background:#fff;opacity:.85}
.pin{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
 background:var(--navy);box-shadow:0 3px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.pin i{transform:rotate(45deg);color:#fff;font-style:normal;font-size:11px;font-weight:700}
.pin.b{background:var(--red)}
.blur{position:absolute;inset:0;backdrop-filter:blur(5px);background:rgba(250,248,240,.35);
 -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 26%,#000 52%);
 mask-image:linear-gradient(to bottom,transparent 0,transparent 26%,#000 52%)}
.lockcard{position:absolute;inset-inline:18px;bottom:18px;background:#fff;border:1px solid var(--line);
 border-radius:16px;padding:18px 20px}
.pinlbl{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 9px;
 font-size:11.5px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px rgba(18,41,77,.12)}

/* empty pattern */
.emptybox{border:1px dashed rgba(26,58,107,.22);background:rgba(255,255,255,.5);border-radius:var(--r);
 padding:34px 28px;text-align:center}
.emptybox .ic{width:52px;height:52px;border-radius:16px;background:var(--cream-d);display:flex;
 align-items:center;justify-content:center;margin:0 auto 16px;opacity:.6}
.emptybox b{display:block;font-size:16.5px;font-weight:700}
.emptybox p{margin:8px auto 0;font-size:13.8px;color:var(--muted);line-height:1.8;max-width:340px}
.emptybox .acts{justify-content:center}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.cmp td,.cmp th{border:1px solid var(--line);padding:9px 11px;text-align:right;vertical-align:top}
.cmp th{background:#f4f1e8;font-weight:700;font-size:12.5px}
.cmp code{background:#f4f1e8;padding:2px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>

<div class="topbar">
  <h1>رحلة المستخدم الجديد — الصفحات كلها</h1>
  <div class="sp"></div>
  <div class="seg" id="nav">
    <button data-p="1" aria-pressed="true">١ · التسجيل</button>
    <button data-p="2" aria-pressed="false">٢ · الأسئلة</button>
    <button data-p="3" aria-pressed="false">٣ · الخدمات</button>
    <button data-p="4" aria-pressed="false">٤ · المساعد</button>
    <button data-p="5" aria-pressed="false">٥ · الخريطة</button>
    <button data-p="6" aria-pressed="false">٦ · الصفحات الفارغة</button>
  </div>
</div>

<div class="stage"><div class="wrap">
<div class="note" id="cap"></div>

<div class="side">
  <div><div class="deskframe" id="desk"></div></div>
  <div><div class="phoneframe"><div class="screen">
    <div class="scroll" id="mob"></div>
    <div class="mtab" id="mtab"></div>
  </div></div></div>
</div>

<div class="note" style="margin-top:20px" id="tail"></div>
</div></div>

<script>
const I=(p,s=19,w=1.6)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ic={
 home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
 msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
 map:'<path d="M14.1 4.1 21 2v16l-6.9 2.1M14.1 4.1 9 6M14.1 4.1v16M9 6 3 4v16l6 2M9 6v16"/>',
 file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h6M9 13h6M9 17h6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 arrow:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
 arrowR:'<path d="M5 12h14M12 5l7 7-7 7"/>',
 back:'<path d="M5 12h14M12 5l7 7-7 7"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
 grad:'<path d="M22 10 12 5 2 10l10 5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
 briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
 plane:'<path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8L8 11l-3 3H3l1 2 2 1 1-2 3-3 3.9 3.7a.5.5 0 0 0 .8-.5Z"/>',
 lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 15h.01M11 15h4M7 9h4"/>',
 bank:'<path d="M3 21h18M5 21V10M9 21V10M15 21V10M19 21V10M2 10h20L12 3Z"/>',
 shield:'<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1 1 0 0 1 1.6 0C14.6 3.8 17 5 19 5a1 1 0 0 1 1 1Z"/>',
 lang:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8 12 3 7 8M12 3v13"/>',
 bell:'<path d="M10.3 21a2 2 0 0 0 3.4 0"/><path d="M3.3 15.3A1 1 0 0 0 4 17h16a1 1 0 0 0 .7-1.7C19.4 14 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.4 6-2.7 7.3"/>',
 inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1Z"/>',
 sparkles:'<path d="M12 3 13.9 8.6 19.5 10.5 13.9 12.4 12 18 10.1 12.4 4.5 10.5 10.1 8.6Z"/><path d="M19 15v4M17 17h4"/>',
 send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
 fork:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-3 9v9"/>',
 stethoscope:'<path d="M11 2v2M5 2v2M5 4v7a6 6 0 0 0 12 0V4"/><circle cx="20" cy="10" r="2"/><path d="M8 15v3a4 4 0 0 0 8 0v-1"/>',
 g:'<path d="M21.35 11.1H12v2.9h5.35c-.25 1.5-1.9 4.4-5.35 4.4a6.4 6.4 0 0 1 0-12.8c1.85 0 3.1.8 3.8 1.5l2.6-2.5A9.3 9.3 0 1 0 12 21.4c5.4 0 9-3.8 9-9.1 0-.6-.05-1-.15-1.2Z"/>',
};
document.getElementById('mtab').innerHTML=
 `<div class="on">${I(ic.home,19)}الرئيسية</div><div>${I(ic.msg,19)}المساعد</div>
  <div>${I(ic.map,19)}الخريطة</div><div>${I(ic.file,19)}الخدمات</div><div>${I(ic.user,19)}حسابي</div>`;

const P={};

/* ══ ١ · التسجيل ══ */
P[1]={
 cap:`<b>١ · صفحة التسجيل <code class="ltr">/auth</code>.</b>
  الحالية: شعار، «أهلًا بعودتك»، زر جوجل، حقلان، زر. <span class="bad">لا شيء يذكّر الزائر لماذا يسجّل</span> —
  وهو غالبًا وصل من صفحة مقفلة ونسي ما كان يريده. ولا يوجد رابط استعادة كلمة مرور إطلاقًا.`,
 tail:`<b>ما أضفته:</b><ul>
  <li>عنوان يخاطب الحالة الفعلية: «أنشئ حسابك المجاني» لا «أهلًا بعودتك» — الجديد لم يَعُد.</li>
  <li>ثلاث فوائد ملموسة بجانب النموذج بدل صفحة عارية — على الهاتف تتحوّل إلى سطر واحد فوق النموذج.</li>
  <li>«مجاني بالكامل · بلا بطاقة ائتمان» تحت الزر مباشرة — أكثر اعتراض شائع.</li>
  <li>رابط <b>نسيت كلمة المرور</b> (غير موجود في المنتج اليوم بأي لغة).</li>
  <li>مبدّل لغة ظاهر — على الهاتف هذه الصفحة بلا ترويسة اليوم فلا سبيل لتغيير اللغة.</li>
  <li>سطر الثقة أسفل: <span class="ltr">KVKK</span> + «لا نشارك بياناتك».</li></ul>`,
 d:`<div class="pg on" style="padding:0"><div style="display:grid;grid-template-columns:1fr 1fr;min-height:600px">
  <div style="padding:44px 40px;display:flex;flex-direction:column;justify-content:center">
   <div style="font-size:26px;font-weight:700;letter-spacing:-2px">rafiq.</div>
   <h2 class="t" style="margin-top:26px">أنشئ حسابك المجاني</h2>
   <p class="d">خطة مرتّبة لإقامتك في إسطنبول، بلغتك، خطوة بخطوة.</p>
   <div style="margin-top:28px;display:flex;flex-direction:column;gap:16px">
    ${[[ic.check,'خطة شخصية من ٨ خطوات','مرتّبة بالترتيب الذي تطلبه الدوائر فعلًا'],
       [ic.msg,'مكالمة مجانية مع خبير محلي','بلغتك، بلا التزام'],
       [ic.upload,'خزنة آمنة لمستنداتك','ارفعها مرة، نستخدمها في كل نموذج']]
      .map(([i,b,s])=>`<div style="display:flex;gap:13px"><span style="opacity:.4;margin-top:2px">${I(i,19)}</span>
      <div><b style="font-size:14.5px;font-weight:600;display:block">${b}</b>
      <span style="font-size:13px;color:var(--muted)">${s}</span></div></div>`).join('')}
   </div>
   <p style="margin-top:30px;font-size:12px;color:var(--muted-2);display:flex;gap:8px;align-items:center">

function go(k){
 const p=P[k];
 document.getElementById('cap').innerHTML=p.cap;
 document.getElementById('tail').innerHTML=p.tail;
 document.getElementById('desk').innerHTML=p.d;
 document.getElementById('mob').innerHTML=p.m;
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('#nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));
 go(b.dataset.p);});
go(1);
</script>
