<!doctype html>
<!-- Static default = Arabic RTL (the primary audience and og:locale).
     src/i18n/index.ts applyDir() overwrites lang+dir at runtime for en/ru/fa,
     so this only decides what crawlers and the pre-JS frame see. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Search requires a crawlable, stable square favicon. The previous
         logo-rafiq-square.png asset was 938×440, which made it ineligible. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <!-- Pinch-zoom must stay available. A previous version cancelled the iOS
         pinch gesture events here to lock the page at "fit to screen"; that is
         the scripted equivalent of user-scalable=no and it fails WCAG 1.4.4,
         which matters because a large share of this audience is elderly. The
         problem those handlers were guarding against — iOS auto-zooming when a
         sub-16px input is focused — is already solved by the 16px input rule in
         src/index.css, so nothing regresses. See zoomAccessibility.test.ts. -->
    <meta name="theme-color" content="#1a3a6b" />
    <title>Rafiq Istanbul</title>
    <meta name="description" content="Residency, banking, housing, health and daily life in Istanbul — guided step by step in your language." />
    <!-- Origin comes from VITE_BASE_URL via Vite's %ENV% HTML substitution (same
         mechanism as the GA id below). These four tags are what a crawler reads
         BEFORE hydration, so they matter more than the runtime ones in
         src/lib/seo.ts — they used to be hardcoded to a host that did not match
         VITE_BASE_URL. The build cannot succeed with the variable unset
         (vite.config.ts), so the placeholder can never ship unreplaced. -->
    <link rel="canonical" href="%VITE_BASE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_BASE_URL%" />
    <meta property="og:locale" content="ar" />
    <meta property="og:title" content="Rafiq Istanbul — Your companion for life in Istanbul" />
    <meta property="og:description" content="Residency (İkamet), banking, housing, health and daily life in Istanbul — guided step by step in Arabic, English, Russian and Farsi." />
    <meta property="og:image" content="%VITE_BASE_URL%/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rafiq Istanbul" />
    <meta name="twitter:description" content="The digital services hub for foreigners in Istanbul — in 4 languages." />
    <meta name="twitter:image" content="%VITE_BASE_URL%/og-cover.png" />
        <!--
      Pre-hydration multilingual SEO: Vercel serves one SPA shell for every
      language route, so the first HTML response otherwise looks Arabic with a
      root canonical until React mounts. Derive the route's language here so
      crawlers and social parsers get a truthful URL even before hydration.
      The React SEO bridge repeats this after route changes.
    -->
    <script>
      (function () {
        var origin = "%VITE_BASE_URL%";
        if (origin.endsWith("/")) origin = origin.slice(0, -1);
        var firstSegment = window.location.pathname.split("/")[1];
        var supported = { ar: true, en: true, ru: true, fa: true };
        var lang = supported[firstSegment] ? firstSegment : "ar";
        var rtl = lang === "ar" || lang === "fa";
        document.documentElement.lang = lang;
        document.documentElement.dir = rtl ? "rtl" : "ltr";

        var rest = supported[firstSegment]
          ? window.location.pathname.slice(firstSegment.length + 1) || "/"
          : window.location.pathname || "/";
        var pagePath = rest === "/" ? "" : rest;
        var pageUrl = origin + "/" + lang + pagePath;
        var canonical = document.head.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute("href", pageUrl);

        var ogUrl = document.head.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute("content", pageUrl);
        var ogLocale = { ar: "ar_SA", en: "en_US", ru: "ru_RU", fa: "fa_IR" }[lang];
        var locale = document.head.querySelector('meta[property="og:locale"]');
        if (locale) locale.setAttribute("content", ogLocale);

        ["ar", "en", "ru", "fa"].forEach(function (alternateLang) {
          var selector = 'link[rel="alternate"][hreflang="' + alternateLang + '"]';
          var link = document.head.querySelector(selector);
          if (!link) {
            link = document.createElement("link");
            link.setAttribute("rel", "alternate");
            link.setAttribute("hreflang", alternateLang);
            document.head.appendChild(link);
          }
          link.setAttribute("href", origin + "/" + alternateLang + pagePath);
        });
        var xDefault = document.head.querySelector('link[rel="alternate"][hreflang="x-default"]');
        if (!xDefault) {
          xDefault = document.createElement("link");
          xDefault.setAttribute("rel", "alternate");
          xDefault.setAttribute("hreflang", "x-default");
          document.head.appendChild(xDefault);
        }
        xDefault.setAttribute("href", origin + "/ar" + pagePath);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // GA4 stays unloaded until the visitor grants analytics consent. Vite
      // replaces the measurement-ID placeholder at build time; it is empty in
      // local development by default.
      (function () {
        var GA_ID = "%VITE_GA_MEASUREMENT_ID%";
        var CONSENT_KEY = 'rafiq_analytics_consent';
        var loaded = false;
        var host = window.location.hostname;
        if (!GA_ID || GA_ID.indexOf('%VITE_') === 0) return;
        // Do not mix preview, local, or temporary Vercel deployments into the
        // production acquisition reports for rafiq.ist.
        if (host !== 'rafiq.ist' && host !== 'www.rafiq.ist') return;

        function consentPayload(state) {
          var granted = state === 'granted';
          return {
            analytics_storage: granted ? 'granted' : 'denied',
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied'
          };
        }

        function updateConsent(state) {
          if (window.gtag) window.gtag('consent', 'update', consentPayload(state));
        }

        function loadGoogleTag() {
          if (loaded) return;
          loaded = true;
          window.dataLayer = window.dataLayer || [];
          function gtag() { window.dataLayer.push(arguments); }
          window.gtag = gtag;
          gtag('consent', 'default', consentPayload('declined'));
          gtag('js', new Date());
          gtag('config', GA_ID, { send_page_view: false });
          updateConsent('granted');

          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }

        window.rafiqGoogleAnalytics = {
          setConsent: function (state) {
            if (state === 'granted') loadGoogleTag();
            else updateConsent('declined');
          }
        };

        try {
          if (localStorage.getItem(CONSENT_KEY) === 'granted') loadGoogleTag();
        } catch (_) {
          // Storage can be unavailable in privacy modes; wait for an explicit choice.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
