<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-rafiq-square.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <script>
      // Keep the page locked at "fit to screen" on phones: stop iOS pinch-zoom
      // (Safari ignores user-scalable=no, so cancel the gesture events too).
      // Safe now that fixed-positioning works app-wide and inputs are 16px
      // (no auto-zoom), so the user is never left stuck zoomed-in.
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
    </script>
    <meta name="theme-color" content="#1a3a6b" />
    <title>Rafiq Istanbul</title>
    <meta name="description" content="Residency, banking, housing, health and daily life in Istanbul — guided step by step in your language." />

    />
