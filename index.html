<!doctype html>
<!-- Static default = Arabic RTL (the primary audience and og:locale).
     src/i18n/index.ts applyDir() overwrites lang+dir at runtime for en/ru/fa,
     so this only decides what crawlers and the pre-JS frame see. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Search requires a crawlable, stable square favicon. The previous
         logo-rafiq-square.png asset was 938×440, which made it ineligible. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <!-- Pinch-zoom must stay available. A previous version cancelled the iOS
         pinch gesture events here to lock the page at "fit to screen"; that is
         the scripted equivalent of user-scalable=no and it fails WCAG 1.4.4,
         which matters because a large share of this audience is elderly. The
         problem those handlers were guarding against — iOS auto-zooming when a
         sub-16px input is focused — is already solved by the 16px input rule in
         src/index.css, so nothing regresses. See zoomAccessibility.test.ts. -->
    <meta name="theme-color" content="#1a3a6b" />
    <!-- #seo-fallback is raw pre-rendered text injected by
         scripts/generate-seo-pages.mjs so crawlers and AI answer engines get
         useful content before React runs (see that script's header comment).
         It sits inside #root and gets wiped out the instant React mounts, but
         on a hard navigation/refresh the browser paints this unstyled HTML
         first, producing a visible flash of plain text. Hiding it visually
         (not with display:none, which some text-only crawlers skip) keeps it
         readable to non-JS clients while removing the flash for real users. -->
    <style>
      #seo-fallback {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <title>Rafiq Istanbul</title>
    <meta name="description" content="Residency, banking, housing, health and daily life in Istanbul — guided step by step in your language." />
    <!-- Origin comes from VITE_BASE_URL via Vite's %ENV% HTML substitution (same
         mechanism as the GA id below). These four tags are what a crawler reads
         BEFORE hydration, so they matter more than the runtime ones in
         src/lib/seo.ts — they used to be hardcoded to a host that did not match
         VITE_BASE_URL. The build cannot succeed with the variable unset
         (vite.config.ts), so the placeholder can never ship unreplaced. -->
    <link rel="canonical" href="%VITE_BASE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_BASE_URL%" />
    <meta property="og:locale" content="ar" />
    <meta property="og:title" content="Rafiq Istanbul — Your companion for life in Istanbul" />
    <meta property="og:description" content="Residency (İkamet), banking, housing, health and daily life in Istanbul — guided step by step in Arabic, English, Russian and Farsi." />
    <meta property="og:image" content="%VITE_BASE_URL%/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rafiq Istanbul" />
    <meta name="twitter:description" content="The digital services hub for foreigners in Istanbul — in 4 languages." />
    <meta name="twitter:image" content="%VITE_BASE_URL%/og-cover.png" />
        <!--
      Pre-hydration multilingual SEO: Vercel serves one SPA shell for every
      language route, so the first HTML response otherwise looks Arabic with a
      root canonical until React mounts. Derive the route's language here so
      crawlers and social parsers get a truthful URL even before hydration.
      The React SEO bridge repeats this after route changes.
    -->
    <script>
      (function () {
        var origin = "%VITE_BASE_URL%";
        if (origin.endsWith("/")) origin = origin.slice(0, -1);
        var firstSegment = window.location.pathname.split("/")[1];
        var supported = { ar: true, en: true, ru: true, fa: true };
        var lang = supported[firstSegment] ? firstSegment : "ar";
        var rtl = lang === "ar" || lang === "fa";
        document.documentElement.lang = lang;
        document.documentElement.dir = rtl ? "rtl" : "ltr";

        var rest = supported[firstSegment]
          ? window.location.pathname.slice(firstSegment.length + 1) || "/"
          : window.location.pathname || "/";
        var pagePath = rest === "/" ? "" : rest;
        var pageUrl = origin + "/" + lang + pagePath;
        var canonical = document.head.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute("href", pageUrl);

        var ogUrl = document.head.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute("content", pageUrl);
        var ogLocale = { ar: "ar_SA", en: "en_US", ru: "ru_RU", fa: "fa_IR" }[lang];
        var locale = document.head.querySelector('meta[property="og:locale"]');
        if (locale) locale.setAttribute("content", ogLocale);

        ["ar", "en", "ru", "fa"].forEach(function (alternateLang) {
          var selector = 'link[rel="alternate"][hreflang="' + alternateLang + '"]';
          var link = document.head.querySelector(selector);
          if (!link) {
            link = document.createElement("link");
            link.setAttribute("rel", "alternate");
            link.setAttribute("hreflang", alternateLang);
            document.head.appendChild(link);
          }
          link.setAttribute("href", origin + "/" + alternateLang + pagePath);
        });
        var xDefault = document.head.querySelector('link[rel="alternate"][hreflang="x-default"]');
        if (!xDefault) {
          xDefault = document.createElement("link");
          xDefault.setAttribute("rel", "alternate");
          xDefault.setAttribute("hreflang", "x-default");
          document.head.appendChild(xDefault);
        }
        xDefault.setAttribute("href", origin + "/ar" + pagePath);

        // Belt-and-braces for the server-side X-Robots-Tag in vercel.json: any
        // host other than the real domain (a *.vercel.app alias, a stray
        // preview, etc.) must never be indexed, even if a crawler ignores the
        // HTTP header and only reads the DOM.
        var host = window.location.hostname;
        if (host !== "rafiq.ist" && host !== "www.rafiq.ist") {
          var robotsMeta = document.head.querySelector('meta[name="robots"]');
          if (!robotsMeta) {
            robotsMeta = document.createElement("meta");
            robotsMeta.setAttribute("name", "robots");
            document.head.appendChild(robotsMeta);
          }
          robotsMeta.setAttribute("content", "noindex, nofollow");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // GA4 stays unloaded until the visitor grants analytics consent. Vite
      // replaces the measurement-ID placeholder at build time; it is empty in
      // local development by default.
      (function () {
        var GA_ID = "%VITE_GA_MEASUREMENT_ID%";
        var CONSENT_KEY = 'rafiq_analytics_consent';
        var loaded = false;
        var host = window.location.hostname;
        if (!GA_ID || GA_ID.indexOf('%VITE_') === 0) return;
        // Do not mix preview, local, or temporary Vercel deployments into the
        // production acquisition reports for rafiq.ist.
        if (host !== 'rafiq.ist' && host !== 'www.rafiq.ist') return;

        function consentPayload(state) {
          var granted = state === 'granted';
          return {
            analytics_storage: granted ? 'granted' : 'denied',
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied'
          };
        }

        function updateConsent(state) {
          if (window.gtag) window.gtag('consent', 'update', consentPayload(state));
        }

        function loadGoogleTag() {
          if (loaded) return;
          loaded = true;
          window.dataLayer = window.dataLayer || [];
          function gtag() { window.dataLayer.push(arguments); }
          window.gtag = gtag;
          gtag('consent', 'default', consentPayload('declined'));
          gtag('js', new Date());
          gtag('config', GA_ID, { send_page_view: false });
          updateConsent('granted');

          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }

        window.rafiqGoogleAnalytics = {
          setConsent: function (state) {
            if (state === 'granted') loadGoogleTag();
            else updateConsent('declined');
          }
        };

        try {
          if (localStorage.getItem(CONSENT_KEY) === 'granted') loadGoogleTag();
        } catch (_) {
          // Storage can be unavailable in privacy modes; wait for an explicit choice.
        }
      })();
    </script>
    <script>
      // Meta (Facebook/Instagram) Pixel — the ad platform's counterpart to the
      // GA4 block above, and deliberately a copy of its shape: same consent
      // key, same production-host guard, same "stay unloaded until granted"
      // rule. Ad measurement must not be the one place that quietly collects
      // before the visitor agrees.
      //
      // A pixel ID is public by design — it ships in every page that loads the
      // pixel and is readable by anyone viewing source — so the live one is
      // written here as the default rather than being a deploy-time secret.
      // That keeps the site's ad measurement working without a dashboard step.
      // VITE_META_PIXEL_ID still overrides it when set, which is how a second
      // environment would point at its own pixel.
      (function () {
        var CONFIGURED = "%VITE_META_PIXEL_ID%";
        var PIXEL_ID = (CONFIGURED && CONFIGURED.indexOf('%VITE_') !== 0)
          ? CONFIGURED
          : '1052019674091480'; // "Rafiq.ist Pixel" in Events Manager
        var CONSENT_KEY = 'rafiq_analytics_consent';
        var loaded = false;
        var host = window.location.hostname;
        if (!PIXEL_ID) return;
        // Same reason as GA4: previews and localhost must never pollute the
        // audiences and conversion counts the ad campaigns optimise against.
        if (host !== 'rafiq.ist' && host !== 'www.rafiq.ist') return;

        function loadPixel() {
          if (loaded) return;
          loaded = true;

          // Standard Meta bootstrap, kept verbatim so the vendor script finds
          // the queue it expects.
          !function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
              n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
            };
            if (!f._fbq) f._fbq = n;
            n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
            t = b.createElement(e); t.async = !0; t.src = v;
            s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
          }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

          window.fbq('init', PIXEL_ID);
          window.fbq('track', 'PageView');
        }

        window.rafiqMetaPixel = {
          setConsent: function (state) {
            // There is no "revoke" call once fbevents.js is running, so the
            // only honest implementation is: load on grant, never load
            // otherwise. A declined visitor's session ends without the vendor
            // script ever being fetched.
            if (state === 'granted') loadPixel();
          }
        };

        try {
          if (localStorage.getItem(CONSENT_KEY) === 'granted') loadPixel();
        } catch (_) {
          // Storage can be unavailable in privacy modes; wait for an explicit choice.
        }
      })();
    </script>
  </head>
  <body>
    <!-- Boot loader: the same Rafiq wordmark the app uses for every waiting
         state, drawn here in plain HTML/CSS so it is on screen from the very
         first paint. Before this, main.tsx waited for the language bundle and
         the JS chunks with NOTHING rendered — on a slow phone connection that
         was a blank (or half-drawn) screen for a second or two, which the
         owner reported as "the loading animation sometimes doesn't show and
         the screen looks scrambled". main.tsx removes it once React has
         mounted. Kept OUTSIDE #root: the build injects the SEO fallback into
         #root and React wipes that container on mount. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf8f0;
        transition: opacity 0.25s ease;
      }
      #boot-loader.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader .bl-box {
        position: relative;
        width: clamp(116px, 30vw, 150px);
        height: clamp(116px, 30vw, 150px);
      }
      #boot-loader .bl-letter {
        position: absolute;
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        transform-origin: 50% 90%;
        animation: blHop 2.4s cubic-bezier(0.34, 1.4, 0.5, 1) infinite;
      }
      @keyframes blHop {
        0%, 46%, 100% { transform: translateY(0) scaleY(1) scaleX(1); }
        8% { transform: translateY(0) scaleY(0.88) scaleX(1.08); }
        22% { transform: translateY(-16%) scaleY(1.09) scaleX(0.95); }
        36% { transform: translateY(0) scaleY(0.94) scaleX(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .bl-letter { animation: none; }
      }
    </style>
    <!-- Without JS nothing will ever remove the loader, and it must not sit on
         top of the pre-rendered SEO text for text-only clients. -->
    <noscript><style>#boot-loader { display: none; }</style></noscript>
    <script>
      // Safety valve: if the app never mounts (a broken chunk, a blocked
      // script) the loader must not hide the page forever.
      setTimeout(function () {
        var b = document.getElementById('boot-loader');
        if (b) b.remove();
      }, 8000);
    </script>
    <div id="boot-loader" role="status" aria-live="polite" aria-busy="true">
      <div class="bl-box" aria-hidden="true">
        <span class="bl-letter" style="left:4.94%;top:32.30%;width:20.41%;height:34.93%;background-image:url(/loader/rafiq1.png);animation-delay:0s"></span>
        <span class="bl-letter" style="left:22.73%;top:39.79%;width:25.68%;height:26.40%;background-image:url(/loader/rafiq2.png);animation-delay:0.13s"></span>
        <span class="bl-letter" style="left:45.30%;top:25.68%;width:17.22%;height:41.07%;background-image:url(/loader/rafiq3.png);animation-delay:0.26s"></span>
        <span class="bl-letter" style="left:61.08%;top:29.98%;width:9.73%;height:34.37%;background-image:url(/loader/rafiq4.png);animation-delay:0.39s"></span>
        <span class="bl-letter" style="left:68.82%;top:38.04%;width:29.59%;height:37.48%;background-image:url(/loader/rafiq5.png);animation-delay:0.52s"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
