<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Rafiq Istanbul roundel: navy stamp, skyline, two red stars -->
  <circle cx="60" cy="60" r="58" fill="#1a3a6b"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#faf8f0" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#faf8f0" stroke-width="0.75"/>
  <text x="60" y="32" text-anchor="middle" fill="#faf8f0" font-family="Montserrat, Inter, sans-serif" font-size="13" font-weight="800" letter-spacing="3">RAFIQ</text>
  <!-- skyline: mosque dome + minarets + tower -->
  <g fill="#faf8f0">
    <rect x="30" y="58" width="2.4" height="18"/>
    <polygon points="31.2,52 33,58 29.4,58"/>
    <rect x="86" y="58" width="2.4" height="18"/>
    <polygon points="87.2,52 89,58 85.4,58"/>
    <path d="M44 76 v-8 a16 16 0 0 1 32 0 v8 z"/>
    <rect x="58.8" y="44" width="2.4" height="8"/>
    <circle cx="60" cy="43" r="1.8"/>
    <rect x="40" y="66" width="4" height="10"/>
    <rect x="76" y="66" width="4" height="10"/>
    <!-- Galata tower -->
    <rect x="22" y="64" width="5" height="12"/>
    <polygon points="24.5,57 28.5,64 20.5,64"/>
    <rect x="93" y="64" width="5" height="12"/>
    <polygon points="95.5,57 99.5,64 91.5,64"/>
    <rect x="20" y="76" width="80" height="1.6"/>
  </g>
  <text x="60" y="94" text-anchor="middle" fill="#faf8f0" font-family="Montserrat, Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2.5">ISTANBUL</text>
  <g fill="#c0392b">
    <path d="M36 88 l1.4 2.9 3.2 .4 -2.3 2.2 .5 3.1 -2.8 -1.5 -2.8 1.5 .5 -3.1 -2.3 -2.2 3.2 -.4 z"/>
    <path d="M84 88 l1.4 2.9 3.2 .4 -2.3 2.2 .5 3.1 -2.8 -1.5 -2.8 1.5 .5 -3.1 -2.3 -2.2 3.2 -.4 z"/>
  </g>
</svg>
